<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Sans Devanagari',sans-serif;background:#f6f7fb}
header{position:sticky;top:0;z-index:10;background:#0b2e65;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:20px}.logo span{color:#ff8c00}nav ul{display:flex;gap:8px;list-style:none}nav a{color:#fff;text-decoration:none;padding:6px 10px;border-radius:6px;font-size:14px}.admin-btn{background:#ff8c00;color:#000!important}

<body>
<textarea id="defaultMangalText" style="display:none;">प्रधानमंत्री ने कोलकाता के श्यामा प्रसाद मुखर्जी बंदरगाह पर जिन तीन नौसैनिक जहाजों आइएनएस दूनागिरी, आइएनएस संशोधक और आइएनएस अग्रय का शुभारंभ किया, उनकी विशेषता यह है कि वे स्वदेशी रूप से डिजाइन और निर्मित हैं। निःसंदेह यह एक उपलब्धि है और इस बात को रेखांकित करती है कि भारत को रक्षा क्षेत्र में अब केवल खरीदार बनकर नहीं रहना चाहिए, बल्कि उसे अपनी आवश्यकता की अधिकाधिक रक्षा सामग्री का उत्पादन देश में ही करना होगा। यह इसलिए आवश्यक है कि वर्तमान में किसी भी देश की सैन्य शक्ति का आकलन केवल इससे नहीं किया जाता कि उसके पास कैसे और कितने हथियार हैं, बल्कि इससे अधिक किया जाता है कि वह अपने स्तर पर रक्षा सामग्री का कितना अधिक निर्माण करता है? यदि भारत को आत्मनिर्भर बनना है तो उसके दायरे में रक्षा सामग्री अनिवार्य रूप से आनी चाहिए। यह ठीक नहीं कि भारत अभी भी रक्षा सामग्री के एक प्रमुख आयातक देश के रूप में जाना जाता है। अच्छी बात यह है कि धीर-धीरे इस स्थिति में परिवर्तन हो रहा है। यह महत्वपूर्ण है कि पिछले कुछ वर्षों में 40 से अधिक स्वदेश निर्मित युद्धपोत और पनडुब्बियाँ भारतीय नौसेना में शामिल की गई हैं। एक समय ऐसा था जब भारत अपनी हर छोटी-बड़ी रक्षा सामग्री का आयात करता था। इससे रणनीतिक और सुरक्षा संबंधी चुनौतियाँ उत्पन्न होती थीं। यह उल्लेखनीय है कि पिछले लगभग एक दशक में रक्षा सामग्री के स्वदेश में निर्माण को बल मिला है। इसके चलते देश में रक्षा उत्पादन में भी वृद्धि हुई है। जहाँ 2014 में भारत का कुल रक्षा उत्पादन 40 हजार करोड़ रुपये था, वहीं अब यह बढ़कर 1.5 लाख करोड़ रुपये हो गया है। यह रक्षा सामग्री के मामले में आत्मनिर्भरता की रेखांकित तो करता है, लेकिन अभी बहुत कुछ हासिल करना शेष है। कुछ समय पहले तक भारत में ज्यादातर रक्षा सामाग्री का उत्पादन सार्वजनिक क्षेत्र के उपक्रमों में होता था। इसके चलते रक्षा सामग्री के उत्पादन की गति धीमी थी और उन्नत रक्षा सामग्री का निर्माण भी नहीं हो पाता था। यह अच्छा हुआ कि रक्षा सामग्री के निर्माण में निजी क्षेत्र का भी योगदान लेना शुरू किया गया। इसका परिणाम यह है कि पिछले कुछ वर्षों में भारत का रक्षा नियांत भी बढ़ा है और वर्तमान में यह 38 हजार करोड़ तक पहुंच गया है। अब भारतीय रक्षा उत्पाद विश्व के करीब 40 देशों में निर्यात किए जाते हैं। 2029 तक रक्षा नियाँत को 50 हजार करोड़ रुपये तक पहुंचाने का लक्ष्य रखा है, लेकिन यह ध्यान रखना चाहिए कि देश में रक्षा सामग्री के उत्पादन की कई परियोजनाएं लंबित चल रही हैं। इनके कारणों की पहचान कर उनका प्राथमिकता के आधार निवारण किया जाना चाहिए।</textarea>

<textarea id="defaultEnglishText" style="display:none;">Delhi and parts of the surrounding States of Punjab, Haryana and Uttar Pradesh encounter their annual air quality inflection point. This is the time when the southwest monsoon has receded and with it, the great drafts in the upper atmosphere that normally flush out pollutants from the gamut of anthropogenic activities such and construction, driving, power generation and the burning of agricultural residue. Through the years, there have been studies commissioned and executive action initiated to study, acknowledge and address the crisis, the science is also fairly clear on the relative contribution of pollutants and the limits of corrective intervention in the face of adverse meteorology and the disruption to this is that the air pollution crisis has now devolved into a stalemate. The Commission for Air Quality Management (CAQM), which is tasked with addressing the causes of air pollution in Delhi and the adjoining States, is now a body packed with expertise but whose powers are limited to evoking and recommending grades of measures depending on the degree of deterioration in air quality. While the CAQM pointed out, as recently as October 31, that the daily average air quality in Delhi from January to October of this year was the best in the last six years, is elides the fact the number of days in November when air quality becomes 'severe' has remained roughly the same. Thus, in 2022, the AQI was in the severe category in the first fortnight of November for three days, the same as in 2021, 2020 and 2019 while there is greater awareness and action to curb the sources of pollution, November, which has in recent years emerged as the critical month for pollution, remains to be tamed. Incidents of stubble burning in Punjab, Haryana and Uttar Pradesh this year have been roughly half that when compared to previous years, though the weeks ahead are expected to see more such activity. While the measures earlier have seen and institutionalized response to tackle air pollution, it is now time for a concerted approach to address these challenges of November. Beyond stubble burning, this means addressing the more daunting challenges of vehicular pollution and construction dust. While urban Delhi could have always blamed the distant farm fires for the pollution crisis, tackling November may mean hard measures and greater inconvenience.</textarea>

<div class="wrap">
<div class="left"><h3>📚 <span id="langLabel">English</span> Matters</h3><div id="matterList" class="matter-list"></div></div>
<div class="box">
<div class="top"><div style="font-weight:700" id="selectedTitle">Koi Matter Select Karo</div><div class="ctrl"><select id="tLang" onchange="changeLang()"><option value="english">English</option><option value="mangal">Mangal</option><option value="krutidev">KrutiDev</option></select><select id="tTime"><option value="60">1 Min</option><option value="300" selected>5 Min</option><option value="600">10 Min</option></select><button class="start" onclick="openUserModal()">Start</button></div></div>
<div class="stats"><div class="s"><b id="wpm">0</b><span>WPM</span></div><div class="s"><b id="acc">100%</b><span>Acc</span></div><div class="s"><b id="timeLeft">05:00</b><span>Time</span></div><div class="s"><b id="err">0</b><span>Err</span></div></div>

<div id="userModal" class="modal"><div class="modal-box"><h3>जानकारी भरें</h3><input id="uName" placeholder="नाम *"><input id="uMobile" placeholder="मोबाइल *" maxlength="10"><button class="btn p1" onclick="startTestWithUser()">Start Test</button><button class="btn" style="background:#eee" onclick="closeUserModal()">Cancel</button></div></div>
<div id="resultModal" class="modal"><div class="modal-box large"><h2>🎉 Result</h2><p id="rNameShow"></p><div class="grid"><div class="rc"><b id="rWpm">0</b>WPM</div><div class="rc"><b id="rAcc">0%</b>Acc</div><div class="rc"><b id="rErr">0</b>Err</div><div class="rc"><b id="rChar">0</b>Chars</div></div><p id="rTitleShow" style="background:#fff7ed;padding:8px;border-radius:8px;font-size:13px;margin:8px 0"></p><button class="btn p2" onclick="shareResult()">Share</button><button class="btn p3" onclick="downloadResultPdf()">PDF</button><button class="btn p1" onclick="location.reload()">Next</button></div></div>
<script>
const TM_KEY='deva_typing_matters_v7', TR_KEY='deva_typing_results', DONE_KEY='deva_done_matters';
function getDefaultMatters(){
  return {
    english:[{id:'e1',title:'Practice No. - 1 The Hindu-Editorial',text:document.getElementById('defaultEnglishText').value.trim()}],
    mangal:[{id:'m1',title:'Mangal - Raksha Samagri', text: document.getElementById('defaultMangalText').value.trim()}],
    krutidev:[{id:'k1',title:'Krutidev - America Iran', text: document.getElementById('defaultKrutidevText').value.trim()}]
  };
}
function getMatters(){
  try{
    let s=localStorage.getItem(TM_KEY);
    if(!s){let d=getDefaultMatters(); localStorage.setItem(TM_KEY,JSON.stringify(d)); return d;}
    let p=JSON.parse(s);
    if(!p.english || p.english.length==0) throw "old";
    return p;
  }catch(e){
    localStorage.removeItem(TM_KEY);
    let d=getDefaultMatters();
    localStorage.setItem(TM_KEY,JSON.stringify(d));
    return d;
  }
}
function getDone(){return JSON.parse(localStorage.getItem(DONE_KEY)||'[]')}
function markDone(id){let a=getDone(); if(!a.includes(id)){a.push(id); localStorage.setItem(DONE_KEY,JSON.stringify(a));}}
let currentMatter=null,timer=null,timeLeft=300,isActive=false,currentUser={},expectedWords=[],errors=0,totalChars=0;
const display=document.getElementById('typingDisplay'),input=document.getElementById('input');
function changeLang(){renderMatterList(); document.getElementById('selectedTitle').innerText='Koi Matter Select Karo'; display.innerHTML='Please Select a title';}
function renderMatterList(){
  let lang=document.getElementById('tLang').value;
  document.getElementById('langLabel').innerText=lang;
  let matters=getMatters()[lang]||[]; let done=getDone();
  if(matters.length==0){document.getElementById('matterList').innerHTML='<div style="padding:20px;text-align:center">No Matter</div>'; return;}
  document.getElementById('matterList').innerHTML=matters.map(m=>{
    let safeTitle = m.title.replace(/</g,'&lt;');
    return '<div class="m-item '+(currentMatter&&currentMatter.id==m.id?'active':'')+'" onclick="selectMatter(\''+m.id+'\')"><div><div style="font-weight:700;font-size:14px">'+safeTitle+'</div><div style="font-size:11px;color:#64748b;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+m.text.slice(0,40)+'...</div></div><div class="'+(done.includes(m.id)?'done':'')+'">'+(done.includes(m.id)?'✓':'○')+'</div></div>';
  }).join('');
}
function selectMatter(id){
  let lang=document.getElementById('tLang').value;
  let matters=getMatters()[lang]||[];
  currentMatter=matters.find(x=>x.id==id);
  if(!currentMatter)return;
  document.getElementById('selectedTitle').innerText=currentMatter.title;
  renderText(); renderMatterList();
}
function formatTime(s){let m=Math.floor(s/60).toString().padStart(2,'0'),sec=(s%60).toString().padStart(2,'0'); return m+':'+sec;}
function openUserModal(){if(!currentMatter)return alert('Pehle matter select karo'); document.getElementById('userModal').style.display='flex';}
function closeUserModal(){document.getElementById('userModal').style.display='none';}
function startTestWithUser(){let n=document.getElementById('uName').value.trim(),mob=document.getElementById('uMobile').value.trim(); if(n.length<2||mob.length<10)return alert('Naam/Mobile bharo'); currentUser={name:n,mobile:mob,date:new Date().toLocaleString()}; closeUserModal(); startTest();}
function startTest(){clearInterval(timer); timeLeft=parseInt(document.getElementById('tTime').value); isActive=true; errors=0; totalChars=0; input.value=''; input.disabled=false; input.focus(); document.getElementById('timeLeft').textContent=formatTime(timeLeft); timer=setInterval(()=>{timeLeft--; document.getElementById('timeLeft').textContent=formatTime(timeLeft); calc(); if(timeLeft<=0)endTest();},1000);}
function renderText(){
  let lang=document.getElementById('tLang').value;
  display.className='display '+lang; input.className=lang;
  expectedWords=currentMatter.text.trim().split(/\s+/);
  display.innerHTML='';
  expectedWords.forEach((w,i)=>{let span=document.createElement('span'); span.textContent=w; span.className='word'+(i==0?' current':''); span.id='w-'+i; display.appendChild(span);});
  display.scrollTop=0;
}
input.addEventListener('input',()=>{
  if(!isActive)return;
  let val=input.value;
  if(val.endsWith(' ') || val.endsWith('\n')){
    let allTyped=val.trim().split(/\s+/);
    let idx=allTyped.length-1;
    if(idx>=0 && idx<expectedWords.length){
      let wEl=document.getElementById('w-'+idx);
      if(wEl){
        if(allTyped[idx]===expectedWords[idx]){wEl.className='word typed-correct';}else{wEl.className='word typed-incorrect'; errors++;}
      }
      let next=document.getElementById('w-'+(idx+1));
      if(next){
        next.className='word current';
        next.scrollIntoView({behavior:'smooth',block:'center'});
      }
      totalChars+=allTyped[idx].length+1;
    }
    if(allTyped.length>=expectedWords.length){endTest();}
  }
  document.getElementById('err').textContent=errors;
  calc();
});
function calc(){let elapsed=parseInt(document.getElementById('tTime').value)-timeLeft; if(elapsed==0)elapsed=1; let wpm=Math.round((totalChars/5)/(elapsed/60)); let typedCount=input.value.trim().split(/\s+/).filter(x=>x).length; let acc=typedCount>0?Math.round(((typedCount-errors)/typedCount)*100):100; document.getElementById('wpm').textContent=wpm>0?wpm:0; document.getElementById('acc').textContent=acc+'%';}
function endTest(){clearInterval(timer); isActive=false; input.disabled=true; let wpm=document.getElementById('wpm').textContent,acc=document.getElementById('acc').textContent; let result={id:Date.now().toString(),...currentUser,lang:document.getElementById('tLang').value,matterTitle:currentMatter.title,matterId:currentMatter.id,wpm,acc,errors,chars:totalChars,time:document.getElementById('tTime').value}; let all=JSON.parse(localStorage.getItem(TR_KEY)||'[]'); all.push(result); localStorage.setItem(TR_KEY,JSON.stringify(all)); markDone(currentMatter.id); showResult(result);}
function showResult(r){document.getElementById('rNameShow').innerText=r.name+' - '+r.mobile; document.getElementById('rWpm').innerText=r.wpm; document.getElementById('rAcc').innerText=r.acc; document.getElementById('rErr').innerText=r.errors; document.getElementById('rChar').innerText=r.chars; document.getElementById('rTitleShow').innerText='Matter: '+r.matterTitle; document.getElementById('resultModal').style.display='flex'; window.currentResult=r;}
function shareResult(){let r=window.currentResult; let txt=r.name+' - '+r.matterTitle+' - WPM:'+r.wpm+' '+r.acc; window.open('https://wa.me/?text='+encodeURIComponent(txt));}
function downloadResultPdf(){let r=window.currentResult; const{jsPDF}=window.jspdf; let doc=new jsPDF(); doc.text('DCTC Typing Result',20,20); doc.text('Name:'+r.name,20,35); doc.text('Matter:'+r.matterTitle,20,45); doc.text('WPM:'+r.wpm+' Acc:'+r.acc,20,55); doc.save(r.name+'.pdf');}
window.addEventListener('load',()=>{renderMatterList();});
</script>
</body>
